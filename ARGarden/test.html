<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 灵境花园 | AI 交互艺术</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none;}
        
        /* 修复摄像头预览样式 */
        #input_video {
            transform: scaleX(-1); /* 镜像翻转 */
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            opacity: 0.2; /* 低透明度背景 */
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }
        
        /* Glassmorphism UI */
        .glass-panel {
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Custom Slider */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #10b981;
            margin-top: -6px;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #4b5563;
            border-radius: 2px;
        }

        .neon-text {
            text-shadow: 0 0 5px #10b981, 0 0 10px #10b981;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #10b981;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body class="text-white">

    <!-- Loading Screen -->
    <div id="loading" class="loading-overlay">
        <i class="fas fa-circle-notch fa-spin text-4xl mb-4"></i>
        <h2 class="text-2xl font-bold tracking-widest">GEMINI ETHEREAL GARDEN</h2>
        <p id="loading-text" class="mt-2 text-gray-400">正在初始化 AI 视觉引擎...</p>
        <p id="perm-hint" class="text-xs text-gray-500 mt-4">请在弹出的对话框中允许使用摄像头</p>
    </div>

    <!-- Video & Canvas (Fixed: Video is now visible as background) -->
    <video id="input_video" playsinline muted autoplay></video>
    <canvas id="output_canvas"></canvas>

    <!-- Status Indicators (Top Right) -->
    <div class="absolute top-4 right-4 z-50 flex flex-col items-end space-y-2 pointer-events-none">
        <div id="gesture-status" class="glass-panel px-4 py-2 rounded-full text-sm font-mono text-green-400 flex items-center gap-2">
            <i class="fas fa-hand-sparkles"></i> <span>等待手势...</span>
        </div>
        <div id="mouth-status" class="glass-panel px-4 py-2 rounded-full text-sm font-mono text-blue-400 flex items-center gap-2">
            <i class="fas fa-face-smile"></i> <span>嘴部闭合</span>
        </div>
        <div id="fps-counter" class="text-xs text-gray-500">FPS: 0</div>
    </div>

    <!-- World Controls v2.5 (Left Panel) -->
    <div class="absolute top-4 left-4 z-50 w-72 glass-panel rounded-xl p-5 transition-all duration-300">
        <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
            <h3 class="font-bold tracking-widest text-sm text-green-500">WORLD CONTROLS v2.5</h3>
            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
        </div>

        <!-- Analysis Section -->
        <div class="mb-6 bg-black/30 p-3 rounded-lg border border-gray-700">
            <h4 class="text-xs text-gray-400 uppercase mb-2">Garden Analysis</h4>
            <div class="grid grid-cols-2 gap-2 text-center">
                <div>
                    <div id="plant-count" class="text-xl font-bold text-white">0</div>
                    <div class="text-[10px] text-gray-500">PLANTS</div>
                </div>
                <div>
                    <div id="garden-health" class="text-xl font-bold text-green-400">100%</div>
                    <div class="text-[10px] text-gray-500">VITALITY</div>
                </div>
            </div>
            <div id="ai-message" class="text-[10px] text-gray-400 mt-2 italic border-t border-gray-800 pt-1 leading-tight">
                "花园静待生命..."
            </div>
        </div>

        <!-- Controls -->
        <div class="space-y-4">
            <!-- Theme -->
            <div>
                <label class="text-xs text-gray-400 uppercase font-bold">Visual Effect</label>
                <div class="flex gap-2 mt-1">
                    <button onclick="setTheme('default')" class="flex-1 bg-gray-800 hover:bg-gray-700 text-xs py-1 rounded border border-gray-600 transition">NATURAL</button>
                    <button onclick="setTheme('neon')" class="flex-1 bg-gray-800 hover:bg-gray-700 text-xs py-1 rounded border border-gray-600 transition text-green-400 neon-text">NEON</button>
                    <button onclick="setTheme('sunset')" class="flex-1 bg-gray-800 hover:bg-gray-700 text-xs py-1 rounded border border-gray-600 transition text-orange-400">SUNSET</button>
                </div>
            </div>

            <!-- Species -->
            <div>
                <label class="text-xs text-gray-400 uppercase font-bold">Species Select</label>
                <select id="species-select" class="w-full mt-1 bg-gray-800 text-xs text-white border border-gray-600 rounded p-1 outline-none">
                    <option value="rose">🌹 Rose (Hybrid)</option>
                    <option value="tulip">🌷 Tulip (Void)</option>
                    <option value="daisy">🌼 Daisy (Solar)</option>
                    <option value="lily">⚜️ Lily (Peace)</option>
                    <option value="poppy">🌺 Poppy (Wild)</option>
                    <option value="random">🎲 Random Genetic</option>
                </select>
            </div>

            <!-- Sliders -->
            <div>
                <div class="flex justify-between text-xs text-gray-400">
                    <span>MAX HEIGHT</span>
                    <span id="height-val">100%</span>
                </div>
                <input type="range" min="20" max="200" value="100" class="w-full mt-1" oninput="updateSetting('maxHeight', this.value)">
            </div>
            
            <div>
                <div class="flex justify-between text-xs text-gray-400">
                    <span>GROWTH SPEED</span>
                    <span id="speed-val">1.0x</span>
                </div>
                <input type="range" min="0.1" max="5.0" step="0.1" value="1.0" class="w-full mt-1" oninput="updateSetting('growthSpeed', this.value)">
            </div>
        </div>

        <!-- Actions -->
        <div class="mt-6 flex gap-2">
            <button onclick="clearGarden()" class="flex-1 bg-red-900/50 hover:bg-red-900/80 border border-red-700 text-red-200 text-xs py-2 rounded transition">
                <i class="fas fa-trash-alt mr-1"></i> PURGE (FIST)
            </button>
            <button onclick="forceBloom()" class="flex-1 bg-blue-900/50 hover:bg-blue-900/80 border border-blue-700 text-blue-200 text-xs py-2 rounded transition">
                <i class="fas fa-seedling mr-1"></i> BLOOM (MOUTH)
            </button>
        </div>
    </div>

    <!-- Instructions Overlay (Bottom Center) -->
    <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 glass-panel px-6 py-3 rounded-2xl flex gap-8 z-40 opacity-80 hover:opacity-100 transition pointer-events-none">
        <div class="text-center">
            <i class="fas fa-hand-holding-medical text-xl text-yellow-400 mb-1"></i>
            <div class="text-[10px] uppercase font-bold">Pinch Index+Thumb</div>
            <div class="text-[10px] text-gray-400">To Plant Seed</div>
        </div>
        <div class="text-center border-l border-r border-gray-600 px-8">
            <i class="far fa-laugh text-xl text-blue-400 mb-1"></i>
            <div class="text-[10px] uppercase font-bold">Open Mouth</div>
            <div class="text-[10px] text-gray-400">To Accelerate Growth</div>
        </div>
        <div class="text-center">
            <i class="fas fa-hand-rock text-xl text-red-400 mb-1"></i>
            <div class="text-[10px] uppercase font-bold">Make a Fist</div>
            <div class="text-[10px] text-gray-400">To Clear World</div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION & STATE ---
        const config = {
            maxPlants: 150,
            pinchThreshold: 0.05, // Distance between thumb and index
            mouthThreshold: 0.05, // Distance between lips
            fistThreshold: 0.08,  // Average finger tip distance to wrist/palm
            theme: 'default'
        };

        const state = {
            plants: [],
            plantingCooldown: 0,
            isMouthOpen: false,
            isFist: false,
            isPinching: false,
            handPos: { x: 0, y: 0 },
            growthMultiplier: 1.0,
            maxHeight: 100
        };

        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const videoElement = document.getElementById('input_video');
        const loadingScreen = document.getElementById('loading');
        const loadingText = document.getElementById('loading-text');

        // Resize Canvas
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- 2. PLANT GENERATION LOGIC ---
        class Plant {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type === 'random' ? ['rose', 'tulip', 'daisy', 'lily', 'poppy'][Math.floor(Math.random() * 5)] : type;
                this.age = 0;
                this.maxAge = 100 + Math.random() * 100;
                this.growth = 0; // 0.0 to 1.0
                this.angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.5; // Slight tilt
                this.size = (Math.random() * 0.5 + 0.5) * (state.maxHeight / 100);
                this.color = this.getColor();
                this.bloomState = 0;
            }

            getColor() {
                const colors = {
                    rose: { h: 340, s: 80, l: 50 },
                    tulip: { h: 45, s: 90, l: 60 },
                    daisy: { h: 60, s: 20, l: 95 },
                    lily: { h: 280, s: 70, l: 70 },
                    poppy: { h: 10, s: 90, l: 50 }
                };
                return colors[this.type];
            }

            update(speed) {
                if (this.growth < 1) {
                    this.growth += 0.005 * speed * state.growthMultiplier;
                } else {
                    if (this.bloomState < 1) {
                        this.bloomState += 0.01 * speed * state.growthMultiplier;
                    }
                }
                this.age++;
            }

            draw(ctx) {
                const actualHeight = 150 * this.size * this.growth;
                
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Draw Stem
                ctx.beginPath();
                ctx.moveTo(0, 0);
                // Quadratic curve for natural bend
                const controlX = Math.cos(this.age * 0.02) * 10 * this.growth;
                ctx.quadraticCurveTo(controlX, -actualHeight / 2, controlX * 2, -actualHeight);
                
                if (config.theme === 'neon') {
                    ctx.strokeStyle = `hsl(${this.color.h}, 100%, 50%)`;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = ctx.strokeStyle;
                    ctx.lineWidth = 2;
                } else if (config.theme === 'sunset') {
                    ctx.strokeStyle = '#3d2b1f';
                    ctx.lineWidth = 3;
                } else {
                    ctx.strokeStyle = '#2d5a27'; // Natural green
                    ctx.lineWidth = 2 * this.growth;
                }
                ctx.stroke();

                // Draw Flower
                if (this.growth > 0.6) {
                    ctx.translate(controlX * 2, -actualHeight);
                    const bloomSize = 20 * this.size * this.bloomState;
                    
                    if (config.theme === 'neon') {
                         ctx.fillStyle = `hsl(${this.color.h}, 100%, 70%)`;
                    } else {
                         ctx.fillStyle = `hsl(${this.color.h}, ${this.color.s}%, ${this.color.l}%)`;
                    }

                    // Simple procedural flower shapes
                    this.drawFlowerHead(ctx, bloomSize);
                }

                ctx.restore();
            }

            drawFlowerHead(ctx, size) {
                ctx.beginPath();
                if (this.type === 'rose') {
                    // Spiralish
                    for (let i = 0; i < 5; i++) {
                        ctx.arc(Math.sin(i)*5, Math.cos(i)*5, size, 0, Math.PI * 2);
                    }
                } else if (this.type === 'tulip') {
                    ctx.ellipse(0, -size/2, size, size*1.5, 0, 0, Math.PI * 2);
                } else if (this.type === 'daisy') {
                    ctx.fillStyle = '#fff';
                    for(let i=0; i<8; i++) {
                        ctx.rotate(Math.PI/4);
                        ctx.rect(-2, 0, 4, size*1.5);
                    }
                    ctx.fill();
                    ctx.beginPath();
                    ctx.fillStyle = '#fdba74'; // Center
                    ctx.arc(0, 0, size/3, 0, Math.PI*2);
                } else {
                     ctx.arc(0, 0, size, 0, Math.PI * 2);
                }
                ctx.fill();
            }
        }

        // --- 3. MEDIAPIPE SETUP ---
        
        // Setup Hands
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        
        // Setup Face Mesh
        const faceMesh = new FaceMesh({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
        }});
        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        // Callbacks
        hands.onResults(onHandResults);
        faceMesh.onResults(onFaceResults);

        function onHandResults(results) {
            state.isPinching = false;
            state.isFist = false;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // Update hand position (Index finger tip)
                state.handPos.x = (1 - landmarks[8].x) * canvas.width;
                state.handPos.y = landmarks[8].y * canvas.height;

                // 1. PINCH DETECTION (Thumb Tip 4 to Index Tip 8)
                const pinchDist = distance(landmarks[4], landmarks[8]);
                if (pinchDist < config.pinchThreshold) {
                    state.isPinching = true;
                    handlePlanting();
                }

                // 2. FIST DETECTION (Fingertips to Wrist)
                // Simplified: Check if tips (8,12,16,20) are close to palm center/wrist(0)
                const tips = [8, 12, 16, 20];
                let foldedFingers = 0;
                tips.forEach(tipIdx => {
                     if (distance(landmarks[tipIdx], landmarks[0]) < config.fistThreshold * 2.5) {
                         foldedFingers++;
                     }
                });

                if (foldedFingers >= 3) {
                    state.isFist = true;
                    handleClearing();
                }
                
                // UI Feedback
                updateGestureUI();
            } else {
                 document.getElementById('gesture-status').innerHTML = '<i class="fas fa-search"></i> <span>寻找手势...</span>';
                 document.getElementById('gesture-status').className = 'glass-panel px-4 py-2 rounded-full text-sm font-mono text-gray-400 flex items-center gap-2';
            }
        }

        function onFaceResults(results) {
            state.isMouthOpen = false;
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                
                // MOUTH DETECTION (Upper Lip 13 to Lower Lip 14)
                const mouthDist = distance(landmarks[13], landmarks[14]);
                
                if (mouthDist > config.mouthThreshold) {
                    state.isMouthOpen = true;
                    state.growthMultiplier = 5.0; // Hyper growth
                } else {
                    state.growthMultiplier = parseFloat(document.querySelector('input[type=range][min="0.1"]').value);
                }

                // UI Feedback
                const mStatus = document.getElementById('mouth-status');
                if (state.isMouthOpen) {
                    mStatus.innerHTML = '<i class="fas fa-laugh-beam"></i> <span>MOUTH: OPEN (GROW)</span>';
                    mStatus.className = 'glass-panel px-4 py-2 rounded-full text-sm font-mono text-pink-400 flex items-center gap-2 border-pink-500 border';
                } else {
                    mStatus.innerHTML = '<i class="fas fa-meh"></i> <span>MOUTH: CLOSED</span>';
                    mStatus.className = 'glass-panel px-4 py-2 rounded-full text-sm font-mono text-blue-400 flex items-center gap-2';
                }
            }
        }

        // Helper Math
        function distance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        // --- 4. GAME LOOP & INTERACTION ---

        function handlePlanting() {
            if (state.plantingCooldown <= 0 && state.plants.length < config.maxPlants) {
                const type = document.getElementById('species-select').value;
                state.plants.push(new Plant(state.handPos.x, state.handPos.y, type));
                state.plantingCooldown = 15; // Frames to wait
                
                // Visual feedback at pinch location
                createSparkle(state.handPos.x, state.handPos.y);
            }
        }

        function handleClearing() {
            if (state.plants.length > 0) {
                // Remove plants gradually for visual effect
                state.plants.pop(); 
                state.plants.pop();
                updateAIStatus("检测到清理指令：正在重置生态系统...");
            }
        }

        function updateGestureUI() {
            const el = document.getElementById('gesture-status');
            if (state.isPinching) {
                el.innerHTML = '<i class="fas fa-seedling"></i> <span>PINCH: PLANTING</span>';
                el.className = 'glass-panel px-4 py-2 rounded-full text-sm font-mono text-green-400 flex items-center gap-2 border-green-500 border';
            } else if (state.isFist) {
                el.innerHTML = '<i class="fas fa-hand-rock"></i> <span>FIST: CLEARING</span>';
                el.className = 'glass-panel px-4 py-2 rounded-full text-sm font-mono text-red-400 flex items-center gap-2 border-red-500 border';
            } else {
                el.innerHTML = '<i class="fas fa-hand-paper"></i> <span>HAND DETECTED</span>';
                el.className = 'glass-panel px-4 py-2 rounded-full text-sm font-mono text-yellow-400 flex items-center gap-2';
            }
        }

        // Sparkle Effect Array
        let sparkles = [];
        function createSparkle(x, y) {
            for(let i=0; i<5; i++) {
                sparkles.push({
                    x: x, y: y,
                    vx: (Math.random()-0.5)*5,
                    vy: (Math.random()-0.5)*5,
                    life: 1.0
                });
            }
        }

        // Main Animation Loop
        function animate() {
            // Clear or Fade Canvas
            // Note: We are no longer drawing the background color here to let the video show through
            // unless we are in specific modes
            
            if (config.theme === 'neon') {
                ctx.fillStyle = 'rgba(10, 10, 15, 0.2)'; // Trails for neon
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else if (config.theme === 'sunset') {
                const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                grad.addColorStop(0, 'rgba(43, 16, 85, 0.5)'); // Semi-transparent
                grad.addColorStop(1, 'rgba(117, 151, 222, 0.5)');
                ctx.fillStyle = grad;
                ctx.fillRect(0,0, canvas.width, canvas.height);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height); // Completely clear for Default (Video shows)
            }
            
            // Update Cooldowns
            if (state.plantingCooldown > 0) state.plantingCooldown--;

            // Draw Plants
            state.plants.forEach(plant => {
                plant.update(1.0); // Base speed
                plant.draw(ctx);
            });

            // Draw Sparkles
            sparkles.forEach((s, i) => {
                s.x += s.vx;
                s.y += s.vy;
                s.life -= 0.05;
                ctx.fillStyle = `rgba(255, 255, 255, ${s.life})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, 2, 0, Math.PI*2);
                ctx.fill();
                if(s.life <= 0) sparkles.splice(i, 1);
            });

            // Draw Hand Cursor
            if (state.handPos.x !== 0) {
                ctx.beginPath();
                ctx.arc(state.handPos.x, state.handPos.y, 10, 0, Math.PI*2);
                ctx.strokeStyle = state.isPinching ? '#10b981' : 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Update UI Stats
            if (Math.random() > 0.9) { // Don't update DOM every frame
                document.getElementById('plant-count').innerText = state.plants.length;
                
                // Fake AI Analysis Logic
                const density = state.plants.length / 50;
                let message = "花园空旷，等待播种...";
                let health = "100%";
                
                if (state.plants.length > 5) {
                    if (state.isMouthOpen) {
                        message = "检测到强光合作用 (Bloom Mode Active)";
                        health = "200% BOOST";
                    } else if (state.isPinching) {
                        message = "正在添加新的生物多样性...";
                    } else {
                        message = `生态系统稳定。当前物种多样性: ${density > 1 ? '丰富' : '适中'}`;
                    }
                }
                updateAIStatus(message);
                document.getElementById('garden-health').innerText = health;
            }

            requestAnimationFrame(animate);
        }

        function updateAIStatus(msg) {
            document.getElementById('ai-message').innerText = msg;
        }

        // --- 5. INITIALIZATION ---

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                try {
                    await hands.send({image: videoElement});
                    await faceMesh.send({image: videoElement});
                } catch(e) {
                    console.log("Frame skipped", e);
                }
            },
            width: 640,
            height: 480
        });

        // Start button
        window.onload = () => {
             // Ensure loading text updates if permission is taking long
             setTimeout(() => {
                 // FIX: Re-query the element and check for existence
                 const loadingEl = document.getElementById('loading');
                 if(loadingEl && !loadingEl.classList.contains('hidden')) {
                     loadingText.innerText = "请允许摄像头权限... (如未弹出请检查浏览器栏)";
                 }
             }, 3000);

             camera.start()
                .then(() => {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => loadingScreen.remove(), 500);
                    animate();
                })
                .catch(err => {
                    console.error(err);
                    loadingText.innerHTML = '<span class="text-red-500">无法启动摄像头</span>';
                    document.getElementById('perm-hint').innerHTML = `错误详情: ${err.message}<br>请确保在 HTTPS 环境下运行或允许浏览器权限。`;
                });
        };

        // UI Helpers
        window.setTheme = (themeName) => {
            config.theme = themeName;
            updateAIStatus(`视觉模式切换为: ${themeName.toUpperCase()}`);
        };

        window.updateSetting = (key, val) => {
            if (key === 'maxHeight') {
                state.maxHeight = parseInt(val);
                document.getElementById('height-val').innerText = val + '%';
            }
            if (key === 'growthSpeed') {
                state.growthMultiplier = parseFloat(val);
                document.getElementById('speed-val').innerText = val + 'x';
            }
        };

        window.clearGarden = () => {
            state.plants = [];
            updateAIStatus("手动系统重置完成。");
        };

        window.forceBloom = () => {
            state.plants.forEach(p => p.growth = 1.0);
            updateAIStatus("强制绽放指令已执行。");
        };

    </script>
</body>
</html>
