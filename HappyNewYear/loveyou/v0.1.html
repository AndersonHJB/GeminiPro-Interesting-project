<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2026 新年快乐</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
        }
        canvas {
            display: block;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            opacity: 0;
            transition: opacity 1s;
        }
        body:hover #controls, body:active #controls {
            opacity: 1;
        }
        .btn {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            backdrop-filter: blur(4px);
            user-select: none;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        /* 提示用户点击以开启声音 */
        #hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.8);
            pointer-events: none;
            font-size: 14px;
            animation: fadeOut 3s forwards;
            animation-delay: 2s;
            text-align: center;
        }
        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="hint">点击屏幕开启音效</div>
<div id="controls">
    <button class="btn" id="restartBtn">重新播放</button>
    <button class="btn" id="soundBtn">🔇 音效关</button>
</div>

<script>
    /**
     * 2026 New Year Fireworks & Particle Text Animation
     * Replicating the visual style of the provided video.
     */

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    let particles = [];
    let fireworks = [];
    let particleTextMap = [];
    
    // Audio Configuration
    const AUDIO_URLS = {
        launch: 'https://ai.bornforthis.cn/HappyNewYear/mp3/shotfire.mp3',
        boom: 'https://ai.bornforthis.cn/HappyNewYear/mp3/boom.mp3'
    };
    
    // Sound state
    let isSoundEnabled = false;
    const soundBtn = document.getElementById('soundBtn');

    // Configuration
    const CONFIG = {
        textList: [
            "再见 2025",
            "3",
            "2",
            "1",
            "2026",
            "新年快乐",
            "一岁一礼",
            "一寸欢喜",
            "愿新年胜旧年",
            "欢愉且胜意",
            "万事皆可期"
        ],
        times: [3000, 1000, 1000, 1000, 3000, 2500, 2500, 2500, 2500, 2500, 3000], 
        particleSize: 2.5, 
        particleColor: 'rgba(255, 255, 255, 0.95)',
        particleSpeed: 0.1, 
        fireworkChance: 0.05, 
        font: 'bold {fontSize}px "Microsoft YaHei", sans-serif'
    };

    let currentIndex = 0;
    let lastTime = 0;
    let textTimer = 0;
    let isAnimating = true;

    // --- Audio Helper ---

    function playSound(type) {
        if (!isSoundEnabled) return;
        
        const url = type === 'launch' ? AUDIO_URLS.launch : AUDIO_URLS.boom;
        const audio = new Audio(url);
        
        // Adjust volume
        if (type === 'launch') {
            audio.volume = 0.3; // Launch is softer
            audio.playbackRate = 1.5; // Slightly faster launch sound
        } else {
            audio.volume = 0.5; // Explosion is louder
        }

        audio.play().catch(e => {
            // Auto-play restrictions might catch here silently
            console.warn('Audio play failed (interaction needed):', e);
        });
    }

    function toggleSound() {
        isSoundEnabled = !isSoundEnabled;
        soundBtn.innerText = isSoundEnabled ? "🔊 音效开" : "🔇 音效关";
        
        // Try to unlock audio context on mobile immediately if needed, 
        // though regular Audio elements usually work fine after first click.
    }

    // --- Setup ---

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Classes ---

    class Particle {
        constructor(x, y) {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.tx = x; // Target X
            this.ty = y; // Target Y
            this.vx = 0;
            this.vy = 0;
            this.color = CONFIG.particleColor;
            this.active = true; // If false, particle fades out
            this.alpha = 1;
        }

        update() {
            if (!this.active) {
                this.alpha -= 0.02;
                this.x += (Math.random() - 0.5) * 2;
                this.y += (Math.random() - 0.5) * 2;
                return;
            }

            // Move towards target
            const dx = this.tx - this.x;
            const dy = this.ty - this.y;
            
            this.x += dx * CONFIG.particleSpeed;
            this.y += dy * CONFIG.particleSpeed;
            
            // Jitter effect
            this.x += (Math.random() - 0.5) * 0.5;
            this.y += (Math.random() - 0.5) * 0.5;
        }

        draw() {
            if (this.alpha <= 0) return;
            ctx.fillStyle = this.color;
            ctx.globalAlpha = this.alpha;
            ctx.beginPath();
            ctx.arc(this.x, this.y, CONFIG.particleSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    class Firework {
        constructor() {
            this.x = Math.random() * width;
            this.y = height;
            this.tx = Math.random() * width;
            this.ty = Math.random() * (height / 2); // Explode in top half
            this.vx = (this.tx - this.x) / 100;
            this.vy = (this.ty - this.y) / 100;
            this.age = 0;
            this.maxAge = 100; // frames to reach target
            this.exploded = false;
            this.sparks = [];
            this.hue = Math.random() * 360;

            // Play Launch Sound
            playSound('launch');
        }

        update() {
            if (!this.exploded) {
                this.x += this.vx;
                this.y += this.vy;
                this.age++;
                // Slight gravity/arc
                this.vy += 0.05;

                if (this.age >= this.maxAge || this.y <= this.ty || this.vy >= 0) {
                    this.explode();
                }
            } else {
                for (let i = this.sparks.length - 1; i >= 0; i--) {
                    this.sparks[i].update();
                    if (this.sparks[i].alpha <= 0) {
                        this.sparks.splice(i, 1);
                    }
                }
            }
        }

        explode() {
            this.exploded = true;
            // Play Boom Sound
            playSound('boom');
            
            const count = 50 + Math.random() * 50;
            for (let i = 0; i < count; i++) {
                this.sparks.push(new Spark(this.x, this.y, this.hue));
            }
        }

        draw() {
            if (!this.exploded) {
                ctx.fillStyle = `hsl(${this.hue}, 100%, 50%)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();
            } else {
                this.sparks.forEach(s => s.draw());
            }
        }

        isDead() {
            return this.exploded && this.sparks.length === 0;
        }
    }

    class Spark {
        constructor(x, y, hue) {
            this.x = x;
            this.y = y;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 3 + 1;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.friction = 0.95;
            this.gravity = 0.05;
            this.hue = hue + (Math.random() - 0.5) * 20;
            this.alpha = 1;
            this.decay = Math.random() * 0.015 + 0.01;
        }

        update() {
            this.vx *= this.friction;
            this.vy *= this.friction;
            this.vy += this.gravity;
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= this.decay;
        }

        draw() {
            ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, ${this.alpha})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // --- Text Processing ---

    function createParticleText(text) {
        // Create an off-screen canvas to sample text
        const offCanvas = document.createElement('canvas');
        const offCtx = offCanvas.getContext('2d');
        
        offCanvas.width = width;
        offCanvas.height = height;

        // Font scaling based on screen width
        const fontSize = Math.min(width / 6, 150); 
        offCtx.font = CONFIG.font.replace('{fontSize}', fontSize);
        offCtx.fillStyle = '#ffffff';
        offCtx.textAlign = 'center';
        offCtx.textBaseline = 'middle';
        
        offCtx.fillText(text, width / 2, height / 2);

        const imageData = offCtx.getImageData(0, 0, width, height).data;
        const gap = 5; // Pixel gap for sampling (density)
        const newTargets = [];

        for (let y = 0; y < height; y += gap) {
            for (let x = 0; x < width; x += gap) {
                const index = (y * width + x) * 4;
                if (imageData[index + 3] > 128) {
                    newTargets.push({ x, y });
                }
            }
        }
        return newTargets;
    }

    function switchText(index) {
        const text = CONFIG.textList[index];
        const targets = createParticleText(text);

        const numExisting = particles.length;
        const numNeeded = targets.length;

        for (let i = 0; i < numNeeded; i++) {
            if (i < numExisting) {
                particles[i].tx = targets[i].x;
                particles[i].ty = targets[i].y;
                particles[i].active = true;
                particles[i].alpha = 1;
            } else {
                particles.push(new Particle(targets[i].x, targets[i].y));
            }
        }

        for (let i = numNeeded; i < numExisting; i++) {
            particles[i].active = false;
        }
    }

    // --- Main Loop ---

    function animate(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const deltaTime = timestamp - lastTime;
        lastTime = timestamp;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.fillRect(0, 0, width, height);

        // Update Text Timer
        if (currentIndex < CONFIG.textList.length) {
            textTimer += deltaTime;
            if (textTimer >= CONFIG.times[currentIndex]) {
                textTimer = 0;
                currentIndex++;
                if (currentIndex < CONFIG.textList.length) {
                    switchText(currentIndex);
                } else {
                    currentIndex = 4; // Loop back to 2026
                    switchText(currentIndex);
                }
            }
        }

        // Manage Fireworks
        let chance = CONFIG.fireworkChance;
        if (CONFIG.textList[currentIndex] === "2026" || CONFIG.textList[currentIndex] === "新年快乐") {
            chance = 0.15;
        }
        
        if (Math.random() < chance) {
            fireworks.push(new Firework());
        }

        for (let i = fireworks.length - 1; i >= 0; i--) {
            fireworks[i].update();
            fireworks[i].draw();
            if (fireworks[i].isDead()) {
                fireworks.splice(i, 1);
            }
        }

        particles.forEach(p => {
            p.update();
            p.draw();
        });

        requestAnimationFrame(animate);
    }

    // --- Initialization ---

    function start() {
        resize();
        currentIndex = 0;
        textTimer = 0;
        particles = [];
        fireworks = [];
        switchText(currentIndex);
        requestAnimationFrame(animate);
    }
    
    // Enable sound on first interaction
    function enableSound() {
        if (!isSoundEnabled) {
            toggleSound();
        }
        // Remove listener after first activation to avoid toggling off inadvertently
        document.body.removeEventListener('click', enableSound);
        document.body.removeEventListener('touchstart', enableSound);
    }

    document.getElementById('restartBtn').addEventListener('click', (e) => {
        e.stopPropagation(); // prevent body click
        start();
        if (!isSoundEnabled) toggleSound();
    });
    
    soundBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleSound();
    });

    // Auto-enable sound on first user tap/click on the background
    document.body.addEventListener('click', enableSound);
    document.body.addEventListener('touchstart', enableSound);

    // Initial Start
    start();

</script>
</body>
</html>
